[project]
name = "cortex-neo"
version = "0.1.0"
description = "Portable, capability-aware Conky desktop telemetry"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Jorge HernÃ¡ndez Montero"}]

[project.urls]
Homepage = "https://github.com/JorgeTato99/cortex-neo-conky-theme"
Documentation = "https://github.com/JorgeTato99/cortex-neo-conky-theme/tree/main/docs"
Issues = "https://github.com/JorgeTato99/cortex-neo-conky-theme/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["baseline", ".venv", "venv", "migrate_source.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
