name: Bug report
description: Visual, sensor or unexpected behavior. English or Spanish welcome.
title: "[Bug]: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop, X11/Wayland, version or commit, physical resolution and desktop scaling.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, expected result and observed result. Include language, palette, font and detail level.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Reviewed screenshots or relevant journal excerpts. Remove keys, tokens and personal data.
