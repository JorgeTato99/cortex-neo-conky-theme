name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Lua runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends liblua5.4-0
      - name: Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: StyLua 2.6.0
        env:
          STYLUA_SHA256: a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895
        run: |
          curl --fail --location --retry 3 \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip \
            --output "$RUNNER_TEMP/stylua.zip"
          echo "$STYLUA_SHA256  $RUNNER_TEMP/stylua.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua-bin"
          chmod +x "$RUNNER_TEMP/stylua-bin/stylua"
          echo "$RUNNER_TEMP/stylua-bin" >> "$GITHUB_PATH"
      - name: Format, syntax and tests
        run: bash scripts/check.sh

  distributions:
    name: Install and render / ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
      env:
        CORTEX_NEO_TEST_CONTAINER: "1"
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clean installation, reinstall, real Conky and uninstall
        run: bash scripts/check_distribution.sh
      - name: Synthetic desktop capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conky-render-${{ strategy.job-index }}
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  arm64:
    name: ARM64 / Python and Lua contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-venv liblua5.4-0
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Python and Lua tests on native ARM64
        run: .venv/bin/python -m unittest discover -s tests -v
